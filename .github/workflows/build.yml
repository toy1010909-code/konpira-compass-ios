name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: konpira-compass-ios

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project KonpiraCompass.xcodeproj \
            -scheme KonpiraCompass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KonpiraCompass.app Payload/
          zip -qr KonpiraCompass.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KonpiraCompass-ipa
          path: konpira-compass-ios/KonpiraCompass.ipa
